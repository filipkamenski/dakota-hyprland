# project.conf - Dakota Hyprland
name: dakota-hyprland
min-version: 2.2

element-path: elements

aliases:
  gitlab: https://gitlab.com/

plugins:
  - origin: pip
    package-name: buildstream-plugins
    elements:
      - cmake
      - meson
      - autotools
      # `make` ships in this same package (src/buildstream_plugins/elements/
      # make.py) but was never declared — so every `kind: make` element failed
      # to load. system/bootc.bst is built with `kind: make`.
      - make
    sources:
      - git
      - cargo

  # `cargo2` (per-crate sha-pinned registry/git crate sources) is in the
  # community package, NOT in buildstream-plugins: that package's `cargo`
  # source reads Cargo.lock and takes a flat {name, version} ref list with no
  # per-crate checksum. system/bootc.bst needs the sha-pinned cargo2 form so
  # every crate in bootc's dependency graph is pinned by digest (R-CI-1).
  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    sources:
      - cargo2

# Public binary artifact cache from upstream freedesktop-sdk.
# connection-config mirrors upstream's own project.conf at
# freedesktop-sdk-26.08.1 verbatim: without the long request-timeout,
# BuildStream's default query timeout aborts mid-probe on a cold CI runner and
# the element is reported as a miss (then rebuilt from source).
#
# MEASURED 2026-10-19 (run 39279994856): this endpoint does NOT serve the
# artifacts we ask for. `bst` reported `Query cache SUCCESS` and then
# `fetch needed` for all 486 elements, including
# freedesktop-sdk.bst:bootstrap/base-sdk/binary-seed-x86_64.bst — the element
# every FDS build needs first. Upstream's CI never uses this URL: in
# freedesktop-sdk-26.08.1's .gitlab-ci.yml + templates/buildstream.conf the
# cache is https://cache.freedesktop-sdk.io:11004 with
# `auth: {access-token: ~/.config/freedesktop-sdk.token}` — a GitLab OIDC token
# minted per job (`id_tokens: CACHE_TOKEN, aud: cache.freedesktop-sdk.io`) — and
# `override-project-caches: true`. Probe results: :11001 -> HTTP 404 to an
# anonymous GET (live, but not-found for our keys); :11004 -> HTTP 401 without
# that token. So from GitHub Actions the FDS cache is unusable and the cold
# build compiles from source; our own artifact store (see the workflow's
# ~/.cache/buildstream mount + restore-keys) is the only cache we get.
artifacts:
  - url: https://cache.freedesktop-sdk.io:11001
    type: all
    push: false
    connection-config:
      keepalive-time: 60
      retry-limit: 4
      retry-delay: 500
      request-timeout: 300

# Same service also serves source tarballs/git mirrors; upstream declares it,
# we did not, so every source was refetched from origin on every run.
source-caches:
  - url: https://cache.freedesktop-sdk.io:11001
    connection-config:
      keepalive-time: 60
      retry-limit: 4
      retry-delay: 500
      request-timeout: 300

environment:
  PKG_CONFIG_PATH: /usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/pkgconfig

variables:
  prefix: /usr
  sysconfdir: /etc
  localstatedir: /var
  libdir: /usr/lib
  bindir: /usr/bin
  sbindir: /usr/sbin
  datadir: /usr/share
  includedir: /usr/include
  mandir: /usr/share/man
  infodir: /usr/share/info
