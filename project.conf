# project.conf - Dakota Hyprland
name: dakota-hyprland
min-version: 2.2

element-path: elements

plugins:
  - origin: pip
    package-name: buildstream-plugins
    elements:
      - meson
      - autotools
    sources:
      - git

junctions:
  freedesktop-sdk.bst:
    sources:
      - kind: git_tag
        url: gitlab:freedesktop-sdk/freedesktop-sdk.git
        track: release/24.08

options:
  target_arch:
    type: arch
    description: Target architecture
    variable: arch
    values:
      - x86_64
      - aarch64
    default: x86_64

variables:
  prefix: /usr
  sysconfdir: /etc
  localstatedir: /var
  libdir: /usr/lib
  bindir: /usr/bin
  sbindir: /usr/sbin
  datadir: /usr/share
  includedir: /usr/include
  mandir: /usr/share/man
  infodir: /usr/share/info
