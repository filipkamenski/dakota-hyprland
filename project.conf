# project.conf - Dakota Hyprland
name: dakota-hyprland
min-version: 2.2

element-path: elements

aliases:
  gitlab: https://gitlab.com/

plugins:
  - origin: pip
    package-name: buildstream-plugins
    elements:
      - cmake
      - meson
      - autotools
      # `make` ships in this same package (src/buildstream_plugins/elements/
      # make.py) but was never declared — so every `kind: make` element failed
      # to load. system/bootc.bst is built with `kind: make`.
      - make
    sources:
      - git
      - cargo

  # `cargo2` (per-crate sha-pinned registry/git crate sources) is in the
  # community package, NOT in buildstream-plugins: that package's `cargo`
  # source reads Cargo.lock and takes a flat {name, version} ref list with no
  # per-crate checksum. system/bootc.bst needs the sha-pinned cargo2 form so
  # every crate in bootc's dependency graph is pinned by digest (R-CI-1).
  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    sources:
      - cargo2

# Public binary artifact cache from upstream freedesktop-sdk.
# connection-config mirrors upstream's own project.conf at
# freedesktop-sdk-26.08.1 verbatim: without the long request-timeout,
# BuildStream's default query timeout aborts mid-probe on a cold CI runner and
# the element is reported as a miss (then rebuilt from source).
#
# CORRECTED 2026-10-21 from run 39294187312's OWN log: this endpoint does serve
# us, anonymously, and it is worth keeping. That run logged 536 artifact pull
# attempts at :11001 — 225 SUCCESS (`Pulled artifact <key> <- https://
# cache.freedesktop-sdk.io:11001`) and 311 SKIPPED with BuildStream's own
# reason, `Remote (https://cache.freedesktop-sdk.io:11001) does not have
# artifact <key> cached` — plus real source-cache hits. A bare anonymous GET of
# the CAS root answering 404 is NOT a probe (it is not the CAS protocol); that
# is where the earlier "not-found for all 486 elements" reading came from, along
# with a misread `fetch needed` line. So :11001 holds a subset of our keys.
# :11004 is upstream's read+push endpoint (GitLab-OIDC access token,
# `override-project-caches: true`) — the push half is what we cannot use, not
# the read half. Net effect stands: a cold build still compiles most elements
# from source, and our own store (the workflow's ~/.cache/buildstream mount +
# restore-keys) is what makes the remainder resume instead of restarting.
artifacts:
  - url: https://cache.freedesktop-sdk.io:11001
    type: all
    push: false
    connection-config:
      keepalive-time: 60
      retry-limit: 4
      retry-delay: 500
      request-timeout: 300

# Same service also serves source tarballs/git mirrors; upstream declares it,
# we did not, so every source was refetched from origin on every run.
source-caches:
  - url: https://cache.freedesktop-sdk.io:11001
    connection-config:
      keepalive-time: 60
      retry-limit: 4
      retry-delay: 500
      request-timeout: 300

environment:
  PKG_CONFIG_PATH: /usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/local/lib/pkgconfig

variables:
  prefix: /usr
  sysconfdir: /etc
  localstatedir: /var
  libdir: /usr/lib
  bindir: /usr/bin
  sbindir: /usr/sbin
  datadir: /usr/share
  includedir: /usr/include
  mandir: /usr/share/man
  infodir: /usr/share/info
