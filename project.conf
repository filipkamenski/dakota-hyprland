# project.conf - Dakota Hyprland
name: dakota-hyprland
min-version: 2.0

element-path: elements

plugins:
  - origin: pip
    package-name: buildstream-plugins
    elements:
      - cmake
      - meson
      - autotools
      - cargo

junctions:
  freedesktop-sdk:
    sources:
      - kind: git_repo
        url: https://gitlab.com/freedesktop-sdk/freedesktop-sdk.git
        track: release/24.08

# Public binary artifact cache from upstream freedesktop-sdk
artifacts:
  - url: https://cache.freedesktop-sdk.io:11001
    type: pull

options:
  target_arch:
    type: arch
    description: Target architecture
    variable: arch
    values:
      - x86_64
      - aarch64
    default: x86_64

variables:
  prefix: /usr
  sysconfdir: /etc
  localstatedir: /var
  libdir: /usr/lib
  bindir: /usr/bin
  sbindir: /usr/sbin
  datadir: /usr/share
  includedir: /usr/include
  mandir: /usr/share/man
  infodir: /usr/share/info
