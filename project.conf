# project.conf - Dakota Hyprland
name: dakota-hyprland
min-version: 2.2

element-path: elements

aliases:
  gitlab: https://gitlab.com/

plugins:
  - origin: pip
    package-name: buildstream-plugins
    elements:
      - cmake
      - meson
      - autotools
    sources:
      - git
  - origin: pip
    package-name: buildstream-plugins-community
    elements:
      - cargo

# Public binary artifact cache from upstream freedesktop-sdk
artifacts:
  - url: https://cache.freedesktop-sdk.io:11001
    type: all
    push: false

variables:
  prefix: /usr
  sysconfdir: /etc
  localstatedir: /var
  libdir: /usr/lib
  bindir: /usr/bin
  sbindir: /usr/sbin
  datadir: /usr/share
  includedir: /usr/include
  mandir: /usr/share/man
  infodir: /usr/share/info
