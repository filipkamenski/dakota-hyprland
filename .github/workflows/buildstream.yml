name: BuildStream OS Pipeline

on:
  push:
    # main publishes :latest; the feature branch is scoped in so a push starts
    # the pipeline without a workflow_dispatch token. The fine-grained PAT in
    # use has contents:write but NOT the Workflow permission, so
    # POST /actions/workflows/<id>/dispatches answers 403 — and a push runs the
    # workflow file carried by the commit itself, which is the documented
    # bootstrap for a workflow that is not yet dispatchable (GitHub only
    # dispatches workflows present on the default branch). Keep the branch list
    # here rather than committing anything to main to make it dispatchable:
    # a push to main publishes :latest from whatever main holds.
    branches: [ main, fix/ci-compose-order-and-verify ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Element to build. Empty = the whole image (image/image.bst). Set a single element (e.g. system/initramfs.bst) to iterate on one failure in ~3 min instead of after a full pass has compiled everything ahead of it.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Every bst invocation below targets this. Empty dispatch input (or a push
      # event, where `inputs` is empty) falls back to the whole image, so the
      # compose/verify/publish steps only ever run for a full build.
      BST_TARGET: ${{ inputs.target || 'image/image.bst' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (GH runners have ~14GB free; our image is 7GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Shipped Configs (layout messages, IPC names)
        run: python3 scripts/lint-config.py

      # The BuildStream store lives on the Pi and is reached over the tailnet
      # (R-CI-6). GitHub's actions/cache caps a repo at 10 GB and evicts on idle;
      # this store reaches 26-28 GB, so nothing ever accumulated across runs
      # (R-CI-4: four passes, 61-107 elements each, zero banked).
      #
      # The Pi store is keyed by PATH and the CAS is content-addressed, so a
      # file's path is a function of its content: unchanged content keeps its
      # path. Sync therefore sends only what is missing -- which is why there is
      # no cache key, no run_id, and no immutability trap. The store overwrites
      # in place, so there is nothing to invalidate and a failed save can simply
      # be retried with the same path.
      #
      # Reachability is proven by .github/workflows/tailnet-smoke.yml: run
      # 44109081071 logged "OK: pi5:2283 accepted a TCP connection over the
      # tailnet", with the runner appearing as an ephemeral node.
      - name: Join the tailnet (BuildStream store on the Pi)
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # Only replay-safe trees are synced: the CAS + artifact refs
      # (content-addressed, so a stale entry can never be used for a changed
      # element, it is simply never referenced) and the fetched sources. build/
      # is scratch and logs/ is noise.
      # THE STORE PATHS, from BuildStream 2.8.1's own _context.py:
      #   casdir      = <cachedir>/cas             <- EVERY artifact's payload
      #   artifactdir = <cachedir>/artifacts/refs  <- refs pointing into the CAS
      #   sourcedir   = <cachedir>/sources         <- fetched tarballs
      #   builddir    = <cachedir>/build           <- scratch, must NOT be synced
      # `artifactdir: ${XDG_CACHE_HOME}/buildstream/artifacts` is the BuildStream
      # 1.x layout; 2.x replaced it with `cachedir` + a CAS. Syncing `artifacts`
      # alone saved only refs: runs 43123944146/43142583233/43159907188 each
      # archived ~1594 MB that was SOURCES ONLY while 173 more elements were
      # "cached successfully" in between -- every pass was a silent cold rebuild
      # and the build could never converge. `cas` is the path that carries
      # compiled elements between runs; the log below prints the layout so this
      # can never drift unnoticed again.
      - name: Restore BuildStream Artifact Store (from the Pi)
        id: bst-cache
        continue-on-error: true
        run: |
          # -e matters: without it a failed sync still ends on a later echo and
          # reports GREEN, which is exactly the silent-drop failure R-CI-4 records
          # for the old save. continue-on-error keeps a store outage from killing
          # the build (a cold build is acceptable); this makes it VISIBLE.
          set -euo pipefail
          echo "--- before restore ---"
          du -sh "$HOME/.cache/buildstream"/* 2>/dev/null || true
          STORE=http://100.99.220.10:11001
          # A store with cas blobs but no artifacts/refs is unusable: bst resolves
          # cached artifacts through the refs, so pulling 6 GB of cas costs 24
          # minutes and changes nothing. Ask before paying. (The 2026-11-18 runs
          # restored 129,708 objects into a ref-less store for exactly this
          # reason: the save pushes cas first and the 6-hour cap cut it before it
          # reached the small index.)
          REMOTE_REFS=$(curl -s --max-time 120 "$STORE/tree?prefix=artifacts" \
            | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))' 2>/dev/null || echo 0)
          if [ "$REMOTE_REFS" -eq 0 ]; then
            echo "::warning::the store holds no artifact refs (cas-only), so a restore cannot help; skipping it and building cold"
          else
            python3 scripts/bst-store-sync.py pull \
              --store "$STORE" \
              --dir "$HOME/.cache/buildstream"
          fi
          echo "--- after restore ---"
          du -sh "$HOME/.cache/buildstream"/* 2>/dev/null || true
          echo "cas blobs:      $(find "$HOME/.cache/buildstream/cas" -type f 2>/dev/null | wc -l)"
          echo "artifact refs:  $(find "$HOME/.cache/buildstream/artifacts" -type f 2>/dev/null | wc -l)"
          echo "cached sources: $(find "$HOME/.cache/buildstream/sources" -type f 2>/dev/null | wc -l)"

      # A pass can only produce an image if it FINISHES the graph by itself. The
      # CAS reaches 26-28 GB while GitHub allows 10 GB of cache per repository,
      # so nothing accumulates across runs (2026-11-12: four passes, 61-107
      # elements each, zero banked). One shape is left -- pull everything the
      # remotes still hold, then build only the remainder inside a single job.
      # This probe measures that coverage BEFORE spending the build window and
      # fails the run fast when it is too low to finish, instead of burning five
      # hours to learn the same thing. It also warms the local store, so the
      # build that follows transfers nothing twice.
      - name: Probe Remote Artifact-Cache Coverage
        id: bst-probe
        # ADVISORY, not a gate. It exists to fail fast when the graph is too big
        # to finish in one job — but on 2026-11-18 it failed twice for reasons
        # that had nothing to do with coverage (run 44308087408: a store with cas
        # blobs and no refs; run 44331385330: 5.7 min, cause unknown because the
        # job was still running and its log is unreadable until it ends), and
        # each failure silently skipped the build, compose, gate and publish
        # steps. The cost of a wrong "go" is a cold build that the build step
        # does anyway (it pulls from the remote caches as it goes); the cost of a
        # wrong "stop" is the whole cycle. So it warns; the build decides.
        continue-on-error: true
        run: |
          set -eu
          mkdir -p "$HOME/.cache/buildstream"
          docker build -t bst-runner -f- . <<'DOCKERFILE'
          FROM python:3.11-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
              git build-essential bubblewrap lzip xz-utils unzip bzip2 && \
              rm -rf /var/lib/apt/lists/*
          RUN pip install --no-cache-dir "buildstream>=2.5" buildstream-plugins \
              buildstream-plugins-community "dulwich" requests tomlkit
          DOCKERFILE
          cat > .ci-probe.sh <<'PROBESCRIPT'
          # --- keep the local CAS inside GitHub's actions/cache limit ---------------
          # actions/cache caps a repository at 10 GB and evicts by LRU. This store reached
          # 10.79 GB (the restore download in run 43496746021 says so), so restores became
          # a coin flip: a "no-op" republish turned into an hour of rebuilding what had
          # already been banked. The cause is bst's defaults -- quota: infinity, and
          # cache-buildtrees: auto, which caches a full build tree for every FAILED build
          # (we have had many, including a 68-minute kernel). cache-buildtrees stops
          # those trees being written at all. A quota bounds the store -- but beware:
          # bst cannot prune artifacts the CURRENT session still needs, so a quota at or
          # below the restored archive size fails the build instead of growing the store.
          mkdir -p /root/.config
          cat > /root/.config/buildstream.conf <<'EOFCONF'
          cache:
            # 32G, NOT 8G. Setting the quota just under actions/cache's 10 GB
            # ceiling (the original 8G) guarantees zero headroom: the restored CAS
            # arrives already at quota, so the first artifact that has to be
            # written fails with "Cache too full" and the whole build stops.
            # That is exactly what killed targeted run 43535175281 -- elements
            # freedesktop-sdk.bst:components/dracut.bst and
            # freedesktop-sdk.bst:bootstrap/go.bst both failed that way while the
            # store already held 286 of 528 elements and 134 artifacts still
            # needed pulling. Headroom is the point. If the resulting archive
            # exceeds the 10 GB ceiling the save step fails, which costs a colder
            # restore on the next run but never corrupts a build.
            quota: 32G
            reserved-disk-space: 5%
            low-watermark: 80%
            pull-buildtrees: False
            cache-buildtrees: never
          EOFCONF

          set -eu
          git config --system --add safe.directory '*' || true
          # `bst artifact pull` RESOLVES THE WHOLE PIPELINE and refuses an
          # inconsistent one, so the refs tracking block that normally runs
          # inside the build step has to run here first: `shell/greetd.bst`
          # carries a cargo source whose `ref` only exists after
          # `bst source track` fills it (run 43290865828 died in 3 s on
          # "Inconsistent pipeline ... cargo source ... is missing ref" having
          # queried zero remotes). Same filter as the build step: our elements
          # only, never the junction.
          echo 'Tracking sources of our own elements (required before the pull)...'
          OURS=$(bst show --format '%{name}' --deps all "$BST_TARGET" \
                 | grep -v '\.bst:' \
                 | grep -vxE 'freedesktop-sdk\.bst|plugins/buildstream-plugins-community\.bst' || true)
          if [ -n "$OURS" ]; then
            bst --error-lines 200 --message-lines 20 source track $OURS || true
          fi
          bst show --format '%{name}' --deps all "$BST_TARGET" > /workspace/.probe-graph.txt
          echo '=== pulling every artifact the configured remotes can serve ==='
          bst artifact pull --deps all "$BST_TARGET" 2>&1 | tee /workspace/.probe.log || true
          # What still needs BUILDING (not what was pulled): artifacts restored
          # from actions/cache are already local, so counting remote pulls
          # mis-reads a healthy pass. No --format: bst's DEFAULT element format
          # already leads with the state column, so parsing column 1 does not
          # depend on getting a field name right. /workspace = host repo root.
          bst show --deps all "$BST_TARGET" > /workspace/.probe-states.txt || true
          PROBESCRIPT
          docker run --privileged --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "$HOME/.cache/buildstream:/root/.cache/buildstream" \
            -e BST_TARGET="$BST_TARGET" \
            -w /workspace bst-runner bash /workspace/.ci-probe.sh
          rm -f .ci-probe.sh
          GRAPH=$(grep -v '\.bst:' .probe-graph.txt | grep -vcxE 'freedesktop-sdk\.bst|plugins/.*\.bst' || true)
          HITS=$(grep -c 'Pulled artifact' .probe.log || true)
          MISSES=$(grep -c 'does not have artifact' .probe.log || true)
          HITS=${HITS:-0}; MISSES=${MISSES:-0}
          QUERIED=$((HITS + MISSES))
          echo "graph elements:  $GRAPH"
          echo "remote hits:     $HITS"
          echo "remote misses:   $MISSES"
          echo "served by (hits per remote):"
          grep -oE 'Pulled artifact [^ ]+ <- [^ ]+' .probe.log 2>/dev/null | awk '{print $NF}' | sort | uniq -c | sort -rn || true
          echo "misses per remote:"
          grep -oE 'Remote \([^)]+\) does not have artifact' .probe.log 2>/dev/null | sed -E 's/Remote \((.*)\) does not.*/\1/' | sort | uniq -c | sort -rn || true
          # THE GATE IS "HOW MANY ELEMENTS STILL NEED BUILDING", not how many were
          # pulled remotely. Artifacts restored from actions/cache are already
          # local, so a healthy pass can legitimately perform ZERO remote pulls:
          # run 43332126454 failed with "0 of 252 queried" while ~505 of 589
          # elements were already present locally, because the previous pass's
          # store came back intact. That is the CAS fix (a0eafca) working.
          # The state query itself runs INSIDE the container (see .ci-probe.sh) --
          # /workspace only exists there; the host sees this file as .probe-states.txt.
          echo '--- element states across the graph (col 1 of bst default format) ---'
          awk 'NF{print $1}' .probe-states.txt | sort | uniq -c | sort -rn | head -8 || true
          NEED=$(awk 'NF{print $1}' .probe-states.txt | grep -civ 'cach' || true)
          NEED=${NEED:-9999}
          ROWS=$(wc -l < .probe-states.txt 2>/dev/null || echo 0)
          REFS=$(find "${HOME}/.cache/buildstream/artifacts" -type f 2>/dev/null | wc -l)
          echo "elements still needing work: $NEED (state rows: $ROWS, local artifact refs: $REFS)"
          # A pass may use 300 min of build time; at the measured ~1.35
          # elements/min that is ~405 elements, so 380 leaves headroom.
          #
          # ZERO ROWS is a diagnostic failure: `bst show` died (inconsistent
          # pipeline, load error) and the empty file would otherwise read as
          # "nothing left to build".
          if [ "$ROWS" -eq 0 ]; then
            echo "::error::state query produced no rows -- bst show failed; see its output above. This is a diagnostic failure, not a coverage result"
            exit 1
          fi
          # A store that holds cas blobs but no refs cannot be used at all: bst
          # resolves cached artifacts THROUGH artifacts/refs, so with zero refs
          # every element looks uncached and the whole graph lands in NEED. That
          # is not a "too big to finish" result -- it is a store with no index,
          # and refusing here WEDGES the pipeline: no refs means no build, and no
          # build means no refs. Observed on 2026-11-18 (run 44308087408): the
          # Pi held 5.74 GB of cas/ (136,803 objects) and 0 artifacts/ and 0
          # sources/, because the previous save was cut by the 6-hour cap while
          # still pushing cas -- `bst-store-sync.py` pushes parts in cas,
          # artifacts, sources order, so the small index lands LAST.
          # In that state a cold build is the only way to repopulate the store,
          # so warn and proceed instead of failing.
          if [ "$NEED" -gt 380 ]; then
            if [ "$REFS" -eq 0 ]; then
              echo "::warning::the local store has no artifact refs (cas-only), so nothing can count as cached; proceeding with a cold build to repopulate it"
            else
              echo "::error::$NEED of $GRAPH elements still need building -- cannot finish inside one job; stopping before the build window"
              exit 1
            fi
          fi
          echo "coverage is good: $HITS pulled remotely, only $NEED elements left to build"

      - name: Build OS Rootfs via BuildStream
        id: bst-build
        run: |
          mkdir -p rootfs
          # R-CI-4: the artifact store MUST live on the host. Without this mount
          # bst writes ~6 h of artifacts into the ephemeral container's /root,
          # which is discarded on exit -- that is why the save step failed with
          # "Path(s) specified in the action for caching do(es) not exist"
          # (total_count: 0 caches) on run 39168905786.
          mkdir -p "$HOME/.cache/buildstream"
          docker build -t bst-runner -f- . <<'DOCKERFILE'
          FROM python:3.11-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
              git build-essential bubblewrap lzip xz-utils unzip bzip2 && \
              rm -rf /var/lib/apt/lists/*
          RUN pip install --no-cache-dir "buildstream>=2.5" buildstream-plugins \
              buildstream-plugins-community "dulwich" requests tomlkit
          DOCKERFILE
          # The in-container steps live in a file with a QUOTED heredoc: written
          # inline inside `bash -c "..."` every $ and backslash needs escaping,
          # which is exactly the kind of quoting that silently mangles a build.
          cat > .ci-build.sh <<'BSTSCRIPT'
          # --- keep the local CAS inside GitHub's actions/cache limit ---------------
          # actions/cache caps a repository at 10 GB and evicts by LRU. This store reached
          # 10.79 GB (the restore download in run 43496746021 says so), so restores became
          # a coin flip: a "no-op" republish turned into an hour of rebuilding what had
          # already been banked. The cause is bst's defaults -- quota: infinity, and
          # cache-buildtrees: auto, which caches a full build tree for every FAILED build
          # (we have had many, including a 68-minute kernel). cache-buildtrees stops
          # those trees being written at all. A quota bounds the store -- but beware:
          # bst cannot prune artifacts the CURRENT session still needs, so a quota at or
          # below the restored archive size fails the build instead of growing the store.
          mkdir -p /root/.config
          cat > /root/.config/buildstream.conf <<'EOFCONF'
          cache:
            # 32G, NOT 8G. Setting the quota just under actions/cache's 10 GB
            # ceiling (the original 8G) guarantees zero headroom: the restored CAS
            # arrives already at quota, so the first artifact that has to be
            # written fails with "Cache too full" and the whole build stops.
            # That is exactly what killed targeted run 43535175281 -- elements
            # freedesktop-sdk.bst:components/dracut.bst and
            # freedesktop-sdk.bst:bootstrap/go.bst both failed that way while the
            # store already held 286 of 528 elements and 134 artifacts still
            # needed pulling. Headroom is the point. If the resulting archive
            # exceeds the 10 GB ceiling the save step fails, which costs a colder
            # restore on the next run but never corrupts a build.
            quota: 32G
            reserved-disk-space: 5%
            low-watermark: 80%
            pull-buildtrees: False
            cache-buildtrees: never
          EOFCONF

          set -eu
          # R-CI-4 follow-up (run 39520007505 died at 3.2 min, before a single
          # element was built): the RESTORED store is extracted by the runner
          # user (uid 1001) while bst runs as root in this container, and git
          # refuses any command inside a repository owned by another uid:
          #   fatal: detected dubious ownership in repository at
          #   /root/.cache/buildstream/sources/git/gitlab_freedesktop_sdk_...
          # That killed `Loading elements` (the junction mirror is read at load
          # time), so three fetch retries and exit 255. Caching sources/ is
          # still right (256 source-cache hits last run) -- the container's own
          # git config is what has to accept the mixed-ownership store. --system
          # (/etc/gitconfig) because it must not depend on $HOME, and it lives
          # only inside this ephemeral container.
          git config --system --add safe.directory '*' || true
          echo 'Validating project dependency tree...'
          bst --error-lines 200 --message-lines 20 show "$BST_TARGET"

          # R-CI-4: track OUR elements only. `--deps all` also re-tracked the
          # freedesktop-sdk junction's elements, moving every FDS source off the
          # ref the release artifacts were built from. That changes their cache
          # keys, and the pins are exactly what the :11001 remote hits are keyed
          # on (measured on run 39294187312: 225 of 536 artifacts served), so
          # the junction stays pinned. Our own elements still get their missing
          # refs filled — but `track` there must be a real ref name, never a
          # glob (see the bootc.bst comment for what `v*` costs).
          echo 'Tracking sources of our own elements only...'
          # `bst show --format` exists, but the option must come AFTER the
          # subcommand — `bst --format X show` is parsed as a top-level option
          # and fails with "No such option '--format'", which is how run
          # 39279994856 died 42s in (fatal under `set -eu`). `|| true` keeps
          # tracking non-fatal either way.
          OURS=$(bst show --format '%{name}' --deps all "$BST_TARGET" \
                 | grep -v '\.bst:' \
                 | grep -vxE 'freedesktop-sdk\.bst|plugins/buildstream-plugins-community\.bst' || true)
          if [ -n "$OURS" ]; then
            bst --error-lines 200 --message-lines 20 source track $OURS || true
          fi

          # R-CI-4: a pass is only worth what it can finish. Nothing survives a
          # run (the CAS hits 26-28 GB against GitHub's 10 GB cache limit), so
          # every pass that is going to produce an image must complete the whole
          # remainder by itself inside this job. The probe step above guarantees
          # the remainder is small enough to fit; this cap is the job budget.
          #   - 2026-11-12: a 150 min cap made things WORSE, because a pass that
          #     cannot clear the FDS bootstrap chain banks nothing at all;
          #   - the job limit is 360 min and compose/gate/publish need ~30, so
          #     300 min is the most build time a publishing pass can have and still
          #     fit the publish inside the limit. A build with good cache coverage
          #     is ~2 h (104 elements), so 300 is ample; a pass needing more is
          #     failing anyway, and a job killed at 360 loses the publish outright.
          # timeout returns 124 and `set -eu` aborts the script here, so the
          # compose/gate steps are skipped (they would only choke on a partial
          # rootfs) while the always() save step still runs.
          echo 'Building OS image (300 min cap; artifacts persist between runs)...'
          # `set +e` around the call on purpose: inside `if ! cmd; then ...`,
          # $? is the status of the NEGATION (always 0), so `rc=$?` there would
          # report success on a timeout. Capture it directly instead.
          set +e
          timeout --signal=TERM --kill-after=60 330m \
            bst --error-lines 200 --message-lines 20 build "$BST_TARGET" 2>&1 \
            | tee /workspace/bst-build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo '::warning::330 min build cap reached - partial artifacts are cached; re-dispatch this workflow to resume'
            else
              echo "bst build failed with exit code $rc"
            fi
            # The log is tee'd to /workspace/bst-build.log (NON-hidden: v4 of
            # upload-artifact skips dotfiles by default, which is how the previous
            # attempt "succeeded" while uploading nothing). The HOST step lifts the
            # tail out of that file into annotations and the job summary -- doing it
            # inside this container did not become annotations, and the container
            # cannot write $GITHUB_STEP_SUMMARY (the path does not exist there).
            exit "$rc"
          fi

          echo 'Checking out compiled rootfs...'
          bst artifact checkout "$BST_TARGET" --directory /workspace/rootfs
          BSTSCRIPT
          # Capture the container's status instead of letting `bash -e` abort on
          # it: the failing element has to be lifted OUT of bst-build.log on the
          # HOST. The container cannot write $GITHUB_STEP_SUMMARY (that path does
          # not exist inside it), and lines it prints internally have already
          # proved unreliable as annotations.
          set +e
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            -v "$HOME/.cache/buildstream:/root/.cache/buildstream" \
            -e BST_TARGET="$BST_TARGET" \
            -w /workspace \
            bst-runner \
            bash /workspace/.ci-build.sh
          build_rc=$?
          set -e
          rm -f .ci-build.sh
          if [ "$build_rc" -ne 0 ]; then
            if [ -f bst-build.log ]; then
              echo "--- last 50 lines of the bst log (annotations) ---"
              tail -n 50 bst-build.log | sed 's/^/::error::/' || true
              {
                echo '## BuildStream build failed'
                echo ''
                echo '```'
                tail -n 60 bst-build.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY" || true
            else
              echo "::error::bst-build.log was not produced at all - the build never started (docker/bst bootstrap failure)"
            fi
            exit "$build_rc"
          fi

      # GitHub returned an EMPTY log archive (22-byte zip) for run 44340402498
      # once it was cancelled at the 6-hour cap, so the failure evidence was lost
      # with the runner. Artifacts outlive that.
      - name: Upload BuildStream log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bst-build-log
          path: |
            bst-build.log
            .probe.log
            .probe-states.txt
            .probe-graph.txt
          include-hidden-files: true
          if-no-files-found: ignore

      # R-IMG-1: the image IS the BuildStream rootfs. Nothing is merged into a
      # second distro. The previous design layered this rootfs over
      # quay.io/centos-bootc/centos-bootc:stream9, which left TWO userlands
      # (el9 glibc 2.34 in /usr/lib64, whose /etc/ld.so.cache won, next to FDS
      # glibc 2.44 in /usr/lib/x86_64-linux-gnu), TWO kernel trees and an ostree
      # sysroot/; the image could not run its own binaries (run 38258985164:
      # "bash: /lib64/libc.so.6: version `GLIBC_2.38' not found (required by
      # bash)"). Composing the rootfs alone removes the cause, not the symptom:
      # no base image is pulled, so no foreign userspace can ride along.
      - name: Compose Image from the FDS Rootfs (single userspace)
        # A targeted dispatch builds one element to iterate on a failure; there is
        # no image to compose in that case.
        if: ${{ env.BST_TARGET == 'image/image.bst' }}
        run: |
          set -eu
          # :latest is reserved for a push to main. Every other trigger that
          # reaches this step (a workflow_dispatch on a branch) publishes to
          # :test instead, so an unverified branch build can be pulled and
          # booted without ever replacing the release tag.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PUBLISH_TAG=latest
          else
            PUBLISH_TAG=test
          fi
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/dakota-hyprland:$PUBLISH_TAG"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "publish target: $IMAGE_NAME"
          # Build debris only — never another distro's files:
          sudo rm -rf rootfs/usr/lib/debug rootfs/usr/src
          sudo find rootfs -name "*.debug" -type f -delete 2>/dev/null || true
          # Pseudo-filesystems must not be baked into the image:
          sudo umount -f rootfs/dev rootfs/proc rootfs/sys 2>/dev/null || true
          sudo rm -rf rootfs/proc rootfs/sys rootfs/dev rootfs/run
          sudo mkdir -p rootfs/proc rootfs/sys rootfs/dev rootfs/run
          # --- bootc/ostree deployment layout, REQUIRED to be switchable ---
          # bootc's composefs upgrade builds an EROFS of this root and refuses an
          # image without these entries. Reported verbatim by the owner's own
          # `bootc switch` on the laptop (2026-11-13):
          #   error: Switching: Composefs Switching: Performing Upgrade
          #          Operation: Pulling composefs repository: Generating
          #          bootable EROFS image: Directory entry "boot" does not exist
          # /boot is the ESP mount point, /ostree the deployment store and
          # /sysroot the physical-root mount point in a booted bootc system; all
          # three are empty directories inside the image. The R-IMG-1 guard
          # below used to assert /ostree and /sysroot were ABSENT, which is the
          # opposite of what bootc needs — see the note there.
          sudo mkdir -p rootfs/boot rootfs/ostree rootfs/sysroot
          sudo chmod 0755 rootfs/boot rootfs/ostree rootfs/sysroot
          # ONE loader cache, generated from the FDS tree by FDS's own ldconfig.
          # A cache inherited from another distro is what sent every FDS binary
          # to el9's /lib64/libc.so.6 (criteria 3 and 4 below assert it is clean).
          # FDS ships an EMPTY /etc/ld.so.conf.d, so name the FDS libdirs
          # explicitly instead of relying on the loader's built-in defaults.
          sudo rm -f rootfs/etc/ld.so.cache
          : > /tmp/ldso.conf
          for d in usr/lib/x86_64-linux-gnu usr/lib; do
            if [ -d "rootfs/$d" ]; then echo "/$d" >> /tmp/ldso.conf; fi
          done
          sudo mkdir -p rootfs/etc/ld.so.conf.d
          sudo install -m 0644 /tmp/ldso.conf rootfs/etc/ld.so.conf.d/00-dakota.conf
          echo "ld.so.conf.d:"; cat /tmp/ldso.conf
          sudo chroot rootfs /usr/bin/ldconfig
          # --- structural assertions on the tree, BEFORE it becomes a layer ---
          KERNELS="$(sudo ls rootfs/usr/lib/modules | sort -u)"
          echo "kernel trees:"; echo "$KERNELS"
          [ "$(echo "$KERNELS" | wc -l)" = "1" ] || { echo "FATAL: expected exactly one kernel tree (R-IMG-1/R-IMG-3)"; exit 1; }
          KVER="$KERNELS"
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          if sudo find rootfs -name '*el9*' -print | grep -q .; then
            echo "FATAL: el9 artefacts in the tree (R-IMG-1)"; sudo find rootfs -name '*el9*' | head; exit 1
          fi
          # R-IMG-1's intent is "no foreign userspace rides along". It used to
          # test that by asserting /sysroot and /ostree were ABSENT, because the
          # el9-based chimera had them — but those directories are exactly what
          # bootc requires, so the guard rejected the correct layout and had to
          # go. What actually distinguishes the chimera is the el9 scan above,
          # the loader checks below and the ld.so.cache check: those stay.
          for d in boot ostree sysroot; do
            [ -d "rootfs/$d" ] || { echo "FATAL: bootc requires /$d in the image (R-IMG-2)"; exit 1; }
          done
          test -e rootfs/usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 || { echo "FATAL: FDS loader missing"; exit 1; }
          if [ -e rootfs/usr/lib64/ld-linux-x86-64.so.2 ]; then
            [ "$(sudo readlink -f rootfs/usr/lib64/ld-linux-x86-64.so.2)" = "$(sudo readlink -f rootfs/usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2)" ] \
              || { echo "FATAL: /usr/lib64 loader is not the FDS loader (R-IMG-1)"; exit 1; }
          fi
          test -s rootfs/etc/ld.so.cache || { echo "FATAL: ld.so.cache was not generated"; exit 1; }
          if strings rootfs/etc/ld.so.cache | grep -q "^/lib64/"; then
            echo "FATAL: ld.so.cache still points at /lib64 (R-IMG-1)"; strings rootfs/etc/ld.so.cache | grep "^/lib64/" | head; exit 1
          fi
          echo "cache entries on FDS paths: $(strings rootfs/etc/ld.so.cache | grep -c '^/usr/lib/x86_64-linux-gnu/' || true)"
          strings rootfs/etc/ld.so.cache | grep -q "^/usr/lib/x86_64-linux-gnu/" || { echo "FATAL: cache has no FDS paths"; exit 1; }
          # Not fatal here — separate requirements, and the publish step refuses
          # to ship an image without them (see R-IMG-2 / R-IMG-4):
          [ -e rootfs/usr/lib/bootc ] || echo "WARNING: no /usr/lib/bootc payload (R-IMG-2 still open)"
          [ -e "rootfs/usr/lib/modules/$KVER/initramfs.img" ] || echo "WARNING: no initramfs.img (R-IMG-4 still open)"
          # Import the tree as-is: one layer, one userspace, no base image.
          sudo tar -C rootfs --numeric-owner -cf - . | docker import \
            --change 'LABEL org.opencontainers.image.title="Dakota Hyprland"' \
            --change 'LABEL org.opencontainers.image.description="BuildStream immutable OS running Hyprland"' \
            --change 'CMD ["/sbin/init"]' - "$IMAGE_NAME"

      # Gate: the composed image must run ITS OWN userland, and must contain
      # exactly one userland, before anything is published. With the el9 base
      # gone this is a real exec again — inside the chimera it could not even
      # start bash, which is why the old gate had to read the tree from outside.
      - name: Verify Composed Image (boot-readiness gate)
        if: ${{ env.BST_TARGET == 'image/image.bst' }}
        run: |
          set -x
          docker run --rm --entrypoint /usr/bin/bash "$IMAGE_NAME" -c '
            set -e
            echo "glibc: $(ldd --version | head -1)"
            echo "systemd: $(systemctl --version | head -1)"
            echo "os-release: $(. /etc/os-release; echo $NAME $VERSION_ID)"
            echo "kernel trees: $(ls /usr/lib/modules | tr "\n" " ")"
            [ "$(ls /usr/lib/modules | wc -l)" = 1 ] || { echo "FATAL: image has multiple kernel trees"; exit 1; }
            [ -e /usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 ] || { echo "FATAL: FDS loader missing"; exit 1; }
            if [ -e /usr/lib64/ld-linux-x86-64.so.2 ] && [ "$(readlink -f /usr/lib64/ld-linux-x86-64.so.2)" != "$(readlink -f /usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2)" ]; then
              echo "FATAL: /usr/lib64 loader is not the FDS loader"; exit 1
            fi
            # bootc needs these to exist; asserting their ABSENCE is exactly what
            # made the first bootc switch fail ('Directory entry "boot" does not exist').
            [ -d /boot ] && [ -d /ostree ] && [ -d /sysroot ] || { echo "FATAL: bootc needs /boot, /ostree and /sysroot in the image"; exit 1; }
            
            if ldconfig -p | grep -q "/lib64/"; then echo "FATAL: ld.so.cache still has /lib64 paths"; ldconfig -p | grep "/lib64/" | head; exit 1; fi
            for b in /usr/bin/bash /usr/bin/systemctl /usr/bin/hyprland; do
              [ -e "$b" ] || { echo "MISSING: $b"; exit 1; }
              if ldd "$b" 2>/dev/null | grep -q "not found"; then echo "BROKEN LINKAGE: $b"; ldd "$b"; exit 1; fi
            done
            echo "userspace: OK (single FDS userland)"
          '
          docker run --rm --entrypoint /usr/bin/bash "$IMAGE_NAME" -c 'grep -E "^(NAME|ID)=" /etc/os-release | grep -q dakota' \
            || { echo "FATAL: /etc/os-release does not identify as Dakota"; exit 1; }
          docker run --rm --entrypoint /usr/bin/bash "$IMAGE_NAME" -c '
            grep -qi btrfs "/usr/lib/modules/$1/modules.builtin" 2>/dev/null \
              || grep -qi btrfs "/usr/lib/modules/$1/modules.dep" \
              || { echo "FATAL: kernel tree has no btrfs support"; exit 1; }
          ' _ "$KVER"
          echo "boot-readiness gate: PASS"

      - name: Publish Image to GHCR
        # :latest is only ever written by a push to main. A workflow_dispatch on
        # a branch publishes the same image to :test so it can be pulled and
        # booted without moving the release tag; PRs never publish (and never
        # log in to GHCR, above).
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && env.BST_TARGET == 'image/image.bst'
        run: |
          # A bootc image without bootc is not deployable, and an image without
          # an initramfs cannot assemble a LUKS+Btrfs root. Both are separate
          # requirements (R-IMG-2 / R-IMG-4); until they land, publishing would
          # replace a working tag with an unbootable one — refuse instead.
          docker run --rm --entrypoint /usr/bin/bash "$IMAGE_NAME" -c '[ -e /usr/lib/bootc ]' \
            || { echo "FATAL: image has no /usr/lib/bootc payload — R-IMG-2 open, refusing to publish"; exit 1; }
          docker run --rm --entrypoint /usr/bin/bash "$IMAGE_NAME" -c "test -e /usr/lib/modules/$KVER/initramfs.img" \
            || { echo "FATAL: image has no initramfs.img — R-IMG-4 open, refusing to publish"; exit 1; }
          # bootc's composefs upgrade refuses a root without these entries
          # ("Generating bootable EROFS image: Directory entry \"boot\" does not
          # exist"), which is how the owner's first `bootc switch` failed on
          # 2026-11-13 — after the image had already been published. The compose
          # step now creates them; this asserts it in the artifact itself.
          for d in boot ostree sysroot; do
            docker run --rm --entrypoint /usr/bin/bash "$IMAGE_NAME" -c "[ -d /$d ]" \
              || { echo "FATAL: image has no /$d — bootc switch cannot use it; refusing to publish"; exit 1; }
          done
          docker push "$IMAGE_NAME"
          # bootc's composefs backend can't read Docker schema2 config blobs on
          # switch (bootc-dev/bootc#1703, "blob unknown to registry"). Re-push the
          # same image as native OCI so bootc switch/upgrade works registry-direct:
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          skopeo copy --format oci \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker-daemon:$IMAGE_NAME" "docker://$IMAGE_NAME"
          skopeo inspect --raw "docker://$IMAGE_NAME" \
            --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | head -3

      # Runs even when the build or the gate failed: only successfully built
      # elements sit in ~/.cache/buildstream, and re-using them is what keeps
      # follow-up runs at ~1 h instead of a 4.5 h cold rebuild.
      # actions/cache/save hard-fails path validation when a declared path does
      # not exist ("Path(s) specified in the action for caching do(es) not
      # exist", total_count: 0 -- the 39168905786 symptom). A run that dies
      # before bst ever writes a store must still save an empty-but-valid one.
      - name: Ensure BuildStream cache dirs exist
        if: always()
        run: |
          mkdir -p "$HOME/.cache/buildstream/cas" \
                   "$HOME/.cache/buildstream/artifacts" \
                   "$HOME/.cache/buildstream/sources"

      # Ground truth for the paths above: sizes and file counts, not conclusions.
      - name: Show BuildStream store layout
        if: always()
        run: |
          du -sh "$HOME/.cache/buildstream"/* 2>/dev/null || true
          echo "cas blobs:      $(find "$HOME/.cache/buildstream/cas" -type f 2>/dev/null | wc -l)"
          echo "artifact refs:  $(find "$HOME/.cache/buildstream/artifacts" -type f 2>/dev/null | wc -l)"
          echo "cached sources: $(find "$HOME/.cache/buildstream/sources" -type f 2>/dev/null | wc -l)"

      - name: Save BuildStream Artifact Store (to the Pi)
        id: bst-save
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          # Bounded, but generously. Run 44340402498 reached the 6-hour kill in
          # this step with the retry and verify still unstarted; 45 min then
          # proved too little to push a full CAS (~10 GB at the measured ~4 MB/s),
          # so the index never landed. 120 min fits after a ~2.5 h build while
          # still leaving room for the retry and the verify step.
          #
          # The index goes out right after the cas is verified (see PUSH_ORDER in
          # scripts/bst-store-sync.py): a save cut during `sources` is harmless,
          # a save cut before `artifacts` leaves a store bst cannot see.
          timeout --signal=TERM --kill-after=60 120m \
            python3 scripts/bst-store-sync.py push \
            --store "http://100.99.220.10:11001" \
            --dir "$HOME/.cache/buildstream"

      # The save above is the ONLY thing that carries hours of compilation into
      # the next run, and it can fail while the step still reports GREEN. Run
      # 43050817110 lost a whole 300-min pass that way: a transient backend fault
      # during the reserve call, swallowed by `continue-on-error: true`, left the
      # run looking like an ordinary warming pass while the store was dropped
      # entirely (the caches API showed total_count: 0). The sync script exits
      # non-zero on any failed file and prints which ones, so that silence is not
      # possible here.
      # The retry is a plain re-run, not a fresh key: the Pi store is keyed by
      # path and overwrites in place, so there is no immutable-key trap to work
      # around -- it just sends whatever is still missing.
      # (`steps.bst-save.outcome` is the result BEFORE continue-on-error, which
      # is why it is the reliable signal here -- `conclusion` is not.)
      - name: Retry BuildStream Artifact Store Save (same paths)
        id: bst-save-retry
        if: always() && steps.bst-save.outcome == 'failure'
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 scripts/bst-store-sync.py push \
            --store "http://100.99.220.10:11001" \
            --dir "$HOME/.cache/buildstream"

      # Step conclusions cannot tell you whether the store survived, so state it
      # explicitly: losing a warming pass's store is the difference between
      # 'resume in ~1 h' and 'redo the whole build cap from zero'.
      - name: Verify BuildStream Artifact Store Was Saved
        if: always()
        run: |
          echo "save outcome:        ${{ steps.bst-save.outcome }}"
          echo "save retry outcome:  ${{ steps.bst-save-retry.outcome }}"
          echo "build step outcome:  ${{ steps.bst-build.outcome }}"
          if [ "${{ steps.bst-save.outcome }}" = "failure" ] \
             && [ "${{ steps.bst-save-retry.outcome }}" = "failure" ]; then
            echo "::warning::both artifact-store saves failed (R-CI-4)"
            # A run that finished the build and published is not a failure even
            # if the store did not save; a warming pass that dropped it is.
            if [ "${{ steps.bst-build.outcome }}" != "success" ]; then
              echo "::error::this run compiled for hours and the artifact store was dropped by the cache backend -- the next run restarts COLD (R-CI-4)"
              exit 1
            fi
          fi
