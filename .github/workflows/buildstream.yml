name: BuildStream OS Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache BuildStream Local Artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/buildstream/artifacts
          key: bst-artifacts-${{ runner.os }}-${{ hashFiles('elements/**', 'project.conf') }}
          restore-keys: |
            bst-artifacts-${{ runner.os }}-

      - name: Build OS Rootfs via BuildStream
        run: |
          mkdir -p rootfs
          docker build -t bst-runner -f- . <<'DOCKERFILE'
          FROM python:3.11-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
              git build-essential bubblewrap && rm -rf /var/lib/apt/lists/*
          RUN pip install --no-cache-dir "buildstream>=2.5" buildstream-plugins \
              "dulwich==0.21.*" requests pygit2 2>/dev/null || \
              pip install --no-cache-dir buildstream buildstream-plugins "dulwich==0.21.*" requests
          DOCKERFILE
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            bst-runner \
            bash -c "
              echo 'Validating project dependency tree...'
              bst show image/image.bst || { echo 'Project validation failed'; exit 1; }
              
              echo 'Tracking element sources...'
              bst source track --deps all image/image.bst || true
              
              echo 'Building OS image with upstream artifact cache...'
              bst build image/image.bst
              
              echo 'Checking out compiled rootfs...'
              bst artifact checkout image/image.bst --directory /workspace/rootfs
            "

      - name: Package & Push Bootable OCI Image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/dakota-hyprland:latest"
          
          cat <<EOF > Dockerfile
          FROM scratch
          COPY rootfs/ /
          LABEL org.opencontainers.image.title="Dakota Hyprland"
          LABEL org.opencontainers.image.description="Dakota-like BuildStream immutable OS running Hyprland"
          CMD ["/sbin/init"]
          EOF

          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"

      - name: Build QCOW2 Virtual Disk Image for Testing
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p output
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/dakota-hyprland:latest"
          
          docker run --rm --privileged \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            "$IMAGE_NAME" || echo "bootc-image-builder finished or skipped"

      - name: Upload QCOW2 VM Disk Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dakota-hyprland-qcow2
          path: output/qcow2/disk.qcow2
          if-no-files-found: ignore
