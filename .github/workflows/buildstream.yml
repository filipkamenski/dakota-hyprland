name: BuildStream OS Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (GH runners have ~14GB free; our image is 7GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Shipped Configs (layout messages, IPC names)
        run: python3 scripts/lint-config.py

      # BuildStream artifact cache: keyed on the full project definition so it
      # invalidates cleanly as ONE unit. No loose restore-keys (that caused the
      # stale-artifact whack-a-mole).
      # Restore and save are SEPARATE steps on purpose: the combined
      # actions/cache@v4 post-step refused to save on the 2026-10-12 run
      # ("State not set"), so a 4.5 h cold build cached nothing and the next run
      # was cold again. Only successfully-built elements enter the local cache,
      # so saving on failure is safe and saves the whole rebuild.
      - name: Restore BuildStream Artifact Store
        id: bst-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/buildstream
          key: bst2-${{ runner.os }}-${{ hashFiles('project.conf', 'elements/**/*.bst', 'versions.yaml') }}
          # The artifact store is content-addressed: a stale entry can never be
          # used for a changed element, it is simply never referenced. So a
          # prefix restore is always safe and is what keeps a one-element edit
          # from recompiling LLVM: without it, ANY change to elements/**/*.bst
          # changes the key above and guarantees a full cold build.
          restore-keys: |
            bst2-${{ runner.os }}-

      - name: Build OS Rootfs via BuildStream
        run: |
          mkdir -p rootfs
          # R-CI-4: the artifact store MUST live on the host. Without this mount
          # bst writes ~6 h of artifacts into the ephemeral container's /root,
          # which is discarded on exit -- that is why the save step failed with
          # "Path(s) specified in the action for caching do(es) not exist"
          # (total_count: 0 caches) on run 39168905786.
          mkdir -p "$HOME/.cache/buildstream"
          docker build -t bst-runner -f- . <<'DOCKERFILE'
          FROM python:3.11-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
              git build-essential bubblewrap lzip xz-utils unzip bzip2 && \
              rm -rf /var/lib/apt/lists/*
          RUN pip install --no-cache-dir "buildstream>=2.5" buildstream-plugins \
              buildstream-plugins-community "dulwich" requests tomlkit
          DOCKERFILE
          # The in-container steps live in a file with a QUOTED heredoc: written
          # inline inside `bash -c "..."` every $ and backslash needs escaping,
          # which is exactly the kind of quoting that silently mangles a build.
          cat > .ci-build.sh <<'BSTSCRIPT'
          set -eu
          echo 'Validating project dependency tree...'
          bst --error-lines 200 --message-lines 20 show image/image.bst

          # R-CI-4: track OUR elements only. `--deps all` also re-tracked the
          # freedesktop-sdk junction's elements, moving every FDS source off the
          # ref the release artifacts were built from. That changes their cache
          # keys; more importantly we cannot use the FDS cache at all (see the
          # 11001/11004 note in project.conf), so the junction must simply stay
          # pinned. Our own elements still get their missing refs filled.
          echo 'Tracking sources of our own elements only...'
          # `bst show --format` exists, but the option must come AFTER the
          # subcommand — `bst --format X show` is parsed as a top-level option
          # and fails with "No such option '--format'", which is how run
          # 39279994856 died 42s in (fatal under `set -eu`). `|| true` keeps
          # tracking non-fatal either way.
          OURS=$(bst show --format '%{name}' --deps all image/image.bst \
                 | grep -v '\.bst:' \
                 | grep -vxE 'freedesktop-sdk\.bst|plugins/buildstream-plugins-community\.bst' || true)
          if [ -n "$OURS" ]; then
            bst --error-lines 200 --message-lines 20 source track $OURS || true
          fi

          echo 'Building OS image with upstream artifact cache...'
          bst --error-lines 200 --message-lines 20 build image/image.bst

          echo 'Checking out compiled rootfs...'
          bst artifact checkout image/image.bst --directory /workspace/rootfs
          BSTSCRIPT
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            -v "$HOME/.cache/buildstream:/root/.cache/buildstream" \
            -w /workspace \
            bst-runner \
            bash /workspace/.ci-build.sh
          rm -f .ci-build.sh

      # R-IMG-1: the image IS the BuildStream rootfs. Nothing is merged into a
      # second distro. The previous design layered this rootfs over
      # quay.io/centos-bootc/centos-bootc:stream9, which left TWO userlands
      # (el9 glibc 2.34 in /usr/lib64, whose /etc/ld.so.cache won, next to FDS
      # glibc 2.44 in /usr/lib/x86_64-linux-gnu), TWO kernel trees and an ostree
      # sysroot/; the image could not run its own binaries (run 38258985164:
      # "bash: /lib64/libc.so.6: version `GLIBC_2.38' not found (required by
      # bash)"). Composing the rootfs alone removes the cause, not the symptom:
      # no base image is pulled, so no foreign userspace can ride along.
      - name: Compose Image from the FDS Rootfs (single userspace)
        run: |
          set -eu
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/dakota-hyprland:latest"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          # Build debris only — never another distro's files:
          sudo rm -rf rootfs/usr/lib/debug rootfs/usr/src
          sudo find rootfs -name "*.debug" -type f -delete 2>/dev/null || true
          # Pseudo-filesystems must not be baked into the image:
          sudo umount -f rootfs/dev rootfs/proc rootfs/sys 2>/dev/null || true
          sudo rm -rf rootfs/proc rootfs/sys rootfs/dev rootfs/run
          sudo mkdir -p rootfs/proc rootfs/sys rootfs/dev rootfs/run
          # ONE loader cache, generated from the FDS tree by FDS's own ldconfig.
          # A cache inherited from another distro is what sent every FDS binary
          # to el9's /lib64/libc.so.6 (criteria 3 and 4 below assert it is clean).
          # FDS ships an EMPTY /etc/ld.so.conf.d, so name the FDS libdirs
          # explicitly instead of relying on the loader's built-in defaults.
          sudo rm -f rootfs/etc/ld.so.cache
          : > /tmp/ldso.conf
          for d in usr/lib/x86_64-linux-gnu usr/lib; do
            if [ -d "rootfs/$d" ]; then echo "/$d" >> /tmp/ldso.conf; fi
          done
          sudo mkdir -p rootfs/etc/ld.so.conf.d
          sudo install -m 0644 /tmp/ldso.conf rootfs/etc/ld.so.conf.d/00-dakota.conf
          echo "ld.so.conf.d:"; cat /tmp/ldso.conf
          sudo chroot rootfs /usr/bin/ldconfig
          # --- structural assertions on the tree, BEFORE it becomes a layer ---
          KERNELS="$(sudo ls rootfs/usr/lib/modules | sort -u)"
          echo "kernel trees:"; echo "$KERNELS"
          [ "$(echo "$KERNELS" | wc -l)" = "1" ] || { echo "FATAL: expected exactly one kernel tree (R-IMG-1/R-IMG-3)"; exit 1; }
          KVER="$KERNELS"
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          if sudo find rootfs -name '*el9*' -print | grep -q .; then
            echo "FATAL: el9 artefacts in the tree (R-IMG-1)"; sudo find rootfs -name '*el9*' | head; exit 1
          fi
          [ ! -d rootfs/sysroot ] || { echo "FATAL: /sysroot present (R-IMG-1)"; exit 1; }
          [ ! -d rootfs/ostree ] || { echo "FATAL: /ostree present (R-IMG-1)"; exit 1; }
          test -e rootfs/usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 || { echo "FATAL: FDS loader missing"; exit 1; }
          if [ -e rootfs/usr/lib64/ld-linux-x86-64.so.2 ]; then
            [ "$(sudo readlink -f rootfs/usr/lib64/ld-linux-x86-64.so.2)" = "$(sudo readlink -f rootfs/usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2)" ] \
              || { echo "FATAL: /usr/lib64 loader is not the FDS loader (R-IMG-1)"; exit 1; }
          fi
          test -s rootfs/etc/ld.so.cache || { echo "FATAL: ld.so.cache was not generated"; exit 1; }
          if strings rootfs/etc/ld.so.cache | grep -q "^/lib64/"; then
            echo "FATAL: ld.so.cache still points at /lib64 (R-IMG-1)"; strings rootfs/etc/ld.so.cache | grep "^/lib64/" | head; exit 1
          fi
          echo "cache entries on FDS paths: $(strings rootfs/etc/ld.so.cache | grep -c '^/usr/lib/x86_64-linux-gnu/' || true)"
          strings rootfs/etc/ld.so.cache | grep -q "^/usr/lib/x86_64-linux-gnu/" || { echo "FATAL: cache has no FDS paths"; exit 1; }
          # Not fatal here — separate requirements, and the publish step refuses
          # to ship an image without them (see R-IMG-2 / R-IMG-4):
          [ -e rootfs/usr/lib/bootc ] || echo "WARNING: no /usr/lib/bootc payload (R-IMG-2 still open)"
          [ -e "rootfs/usr/lib/modules/$KVER/initramfs.img" ] || echo "WARNING: no initramfs.img (R-IMG-4 still open)"
          # Import the tree as-is: one layer, one userspace, no base image.
          sudo tar -C rootfs --numeric-owner -cf - . | docker import \
            --change 'LABEL org.opencontainers.image.title="Dakota Hyprland"' \
            --change 'LABEL org.opencontainers.image.description="BuildStream immutable OS running Hyprland"' \
            --change 'CMD ["/sbin/init"]' - "$IMAGE_NAME"

      # Gate: the composed image must run ITS OWN userland, and must contain
      # exactly one userland, before anything is published. With the el9 base
      # gone this is a real exec again — inside the chimera it could not even
      # start bash, which is why the old gate had to read the tree from outside.
      - name: Verify Composed Image (boot-readiness gate)
        run: |
          set -x
          docker run --rm --entrypoint /usr/bin/bash "$IMAGE_NAME" -c '
            set -e
            echo "glibc: $(ldd --version | head -1)"
            echo "systemd: $(systemctl --version | head -1)"
            echo "os-release: $(. /etc/os-release; echo $NAME $VERSION_ID)"
            echo "kernel trees: $(ls /usr/lib/modules | tr "\n" " ")"
            [ "$(ls /usr/lib/modules | wc -l)" = 1 ] || { echo "FATAL: image has multiple kernel trees"; exit 1; }
            [ -e /usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 ] || { echo "FATAL: FDS loader missing"; exit 1; }
            if [ -e /usr/lib64/ld-linux-x86-64.so.2 ] && [ "$(readlink -f /usr/lib64/ld-linux-x86-64.so.2)" != "$(readlink -f /usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2)" ]; then
              echo "FATAL: /usr/lib64 loader is not the FDS loader"; exit 1
            fi
            [ ! -e /sysroot ] || { echo "FATAL: /sysroot present"; exit 1; }
            [ ! -e /ostree ]  || { echo "FATAL: /ostree present"; exit 1; }
            if ldconfig -p | grep -q "/lib64/"; then echo "FATAL: ld.so.cache still has /lib64 paths"; ldconfig -p | grep "/lib64/" | head; exit 1; fi
            for b in /usr/bin/bash /usr/bin/systemctl /usr/bin/hyprland; do
              [ -e "$b" ] || { echo "MISSING: $b"; exit 1; }
              if ldd "$b" 2>/dev/null | grep -q "not found"; then echo "BROKEN LINKAGE: $b"; ldd "$b"; exit 1; fi
            done
            echo "userspace: OK (single FDS userland)"
          '
          docker run --rm --entrypoint /usr/bin/bash "$IMAGE_NAME" -c 'grep -E "^(NAME|ID)=" /etc/os-release | grep -q dakota' \
            || { echo "FATAL: /etc/os-release does not identify as Dakota"; exit 1; }
          docker run --rm --entrypoint /usr/bin/bash "$IMAGE_NAME" -c '
            grep -qi btrfs "/usr/lib/modules/$1/modules.builtin" 2>/dev/null \
              || grep -qi btrfs "/usr/lib/modules/$1/modules.dep" \
              || { echo "FATAL: kernel tree has no btrfs support"; exit 1; }
          ' _ "$KVER"
          echo "boot-readiness gate: PASS"

      - name: Publish Image to GHCR
        # Only a push to main may publish: never a PR, never a branch dispatch.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # A bootc image without bootc is not deployable, and an image without
          # an initramfs cannot assemble a LUKS+Btrfs root. Both are separate
          # requirements (R-IMG-2 / R-IMG-4); until they land, publishing would
          # replace a working tag with an unbootable one — refuse instead.
          docker run --rm --entrypoint /usr/bin/bash "$IMAGE_NAME" -c '[ -e /usr/lib/bootc ]' \
            || { echo "FATAL: image has no /usr/lib/bootc payload — R-IMG-2 open, refusing to publish"; exit 1; }
          docker run --rm --entrypoint /usr/bin/bash "$IMAGE_NAME" -c "test -e /usr/lib/modules/$KVER/initramfs.img" \
            || { echo "FATAL: image has no initramfs.img — R-IMG-4 open, refusing to publish"; exit 1; }
          docker push "$IMAGE_NAME"
          # bootc's composefs backend can't read Docker schema2 config blobs on
          # switch (bootc-dev/bootc#1703, "blob unknown to registry"). Re-push the
          # same image as native OCI so bootc switch/upgrade works registry-direct:
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          skopeo copy --format oci \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker-daemon:$IMAGE_NAME" "docker://$IMAGE_NAME"
          skopeo inspect --raw "docker://$IMAGE_NAME" \
            --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | head -3

      # Runs even when the build or the gate failed: only successfully built
      # elements sit in ~/.cache/buildstream, and re-using them is what keeps
      # follow-up runs at ~1 h instead of a 4.5 h cold rebuild.
      - name: Save BuildStream Artifact Store
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/buildstream
          key: bst2-${{ runner.os }}-${{ hashFiles('project.conf', 'elements/**/*.bst', 'versions.yaml') }}
