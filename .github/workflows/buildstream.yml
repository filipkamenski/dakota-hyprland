name: BuildStream OS Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (GH runners have ~14GB free; our image is 7GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildStream artifact cache: keyed on the full project definition so it
      # invalidates cleanly as ONE unit. No loose restore-keys (that caused the
      # stale-artifact whack-a-mole). Save happens post-job; failed builds
      # save too (partial artifacts are still keyed by exact cache key and
      # only successfully-built elements enter the local cache).
      - name: Cache BuildStream Artifact Store
        uses: actions/cache@v4
        with:
          path: ~/.cache/buildstream
          key: bst2-${{ runner.os }}-${{ hashFiles('project.conf', 'elements/**/*.bst', 'versions.yaml') }}

      - name: Build OS Rootfs via BuildStream
        run: |
          mkdir -p rootfs
          docker build -t bst-runner -f- . <<'DOCKERFILE'
          FROM python:3.11-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
              git build-essential bubblewrap lzip xz-utils unzip bzip2 && \
              rm -rf /var/lib/apt/lists/*
          RUN pip install --no-cache-dir "buildstream>=2.5" buildstream-plugins \
              buildstream-plugins-community "dulwich" requests tomlkit
          DOCKERFILE
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            bst-runner \
            bash -c "
              echo 'Validating project dependency tree...'
              bst --error-lines 200 --message-lines 20 show image/image.bst || { echo 'Project validation failed'; exit 1; }

              echo 'Tracking element sources (fills missing refs; ABI-sensitive elements are pinned to stable branches/tags)'
              bst --error-lines 200 --message-lines 20 source track --deps all image/image.bst || true

              echo 'Building OS image with upstream artifact cache...'
              bst --error-lines 200 --message-lines 20 build image/image.bst

              echo 'Checking out compiled rootfs...'
              bst artifact checkout image/image.bst --directory /workspace/rootfs
            "

      - name: Create Bootable bootc Image (derived)
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/dakota-hyprland:latest"
          docker run -d --name dakota-merge --entrypoint sleep quay.io/centos-bootc/centos-bootc:stream9 900
          for i in $(seq 1 30); do docker inspect dakota-merge >/dev/null 2>&1 && break; sleep 2; done
          # Strip debug symbol trees (FDS ships unstripped; halves the image):
          sudo rm -rf rootfs/usr/lib/debug rootfs/usr/src
          sudo find rootfs -name "*.debug" -type f -delete 2>/dev/null || true
          # FDS rootfs ships /usr/sbin as a symlink to bin; bootc base has a real dir — normalize:
          if [ -L rootfs/usr/sbin ]; then sudo rm rootfs/usr/sbin && sudo mkdir rootfs/usr/sbin; fi
          # Single-kernel image: the FDS 7.2.x kernel must be the ONLY kernel — the el9
          # 5.14 base kernel hard-hangs in PCI enumeration on 2026-era hardware. Remove
          # base kernels from the FDS tree, then generate its initramfs in a chroot of
          # the FDS tree itself (FDS bash+dracut+kmod are native there; the FDS userland
          # cannot exec under the merge container's el9 glibc).
          sudo ls rootfs/usr/lib/modules/
          for k in rootfs/usr/lib/modules/*; do
            case "$k" in *el9*|*el10*) sudo rm -rf "$k";; esac
          done
          KVER="$(sudo ls rootfs/usr/lib/modules | head -n1)"
          echo "FDS kernel: $KVER"
          # FDS tree lacks runtime scratch dirs dracut expects:
          sudo mkdir -p rootfs/var/tmp rootfs/tmp rootfs/var/lib/rpm rootfs/dev rootfs/proc rootfs/sys rootfs/run
          sudo mount --bind /dev  rootfs/dev  2>/dev/null || true
          sudo mount --bind /proc rootfs/proc 2>/dev/null || true
          sudo mount --bind /sys  rootfs/sys  2>/dev/null || true
          trap 'sudo umount -f rootfs/dev rootfs/proc rootfs/sys 2>/dev/null || true' EXIT
          sudo chroot rootfs /usr/bin/env DRACUT_KMODDIR_OVERRIDE=1 /usr/bin/bash -c '
            set -e
            KVER="'"$KVER"'"
            depmod -b / "${KVER}"
            # FDS ships no dmsetup (lvm2 tools are not built), and dracut's crypt
            # module hard-requires the dm module for it. cryptsetup talks to
            # device-mapper itself, so drop the dm dep and force the dm kernel
            # modules instead:
            echo "== dracut diagnostics:"
            ls -la /usr/bin/dracut /usr/sbin/dracut 2>/dev/null || true
            ls /usr/lib/dracut/ 2>/dev/null | head -5 || true
            echo "PATH=$PATH"
            find /usr -maxdepth 3 -name "dracut*" 2>/dev/null | head -10
            echo "== end diagnostics"
            CRYPTMOD="$(ls -d /usr/lib/dracut/modules.d/*crypt* 2>/dev/null | head -n1 || true)"
            echo "crypt module dir: ${CRYPTMOD:-none}"
            if [ -n "$CRYPTMOD" ] && [ -f "$CRYPTMOD/module-setup.sh" ]; then
              sed -i "/echo dm$/d" "$CRYPTMOD/module-setup.sh"
            fi
            # bootc deploy requires the initramfs named initramfs.img; must include
            # crypt (LUKS root) + ostree (composefs handoff):
            dracut --no-compress \
              --kmoddir "/usr/lib/modules/${KVER}" \
              --add-drivers " dm_mod dm_crypt " \
              --add " systemd ostree crypt " --omit " multipath lvm " \
              --filesystems " btrfs " \
              "/usr/lib/modules/${KVER}/initramfs.img" "${KVER}"
            ls -la "/usr/lib/modules/${KVER}/"
          ' || { echo "dracut failed"; exit 1; }
          # FDS rootfs ships /usr/sbin as a symlink to bin; bootc base has a real dir — normalize:
          if [ -L rootfs/usr/sbin ]; then sudo rm rootfs/usr/sbin && sudo mkdir rootfs/usr/sbin; fi
          # Unmount the chroot binds and clear pseudo-filesystem mountpoints before
          # streaming (they contain host procfs/devfs and must not enter the image):
          sudo umount -f rootfs/dev rootfs/proc rootfs/sys 2>/dev/null || true
          sudo rm -rf rootfs/proc rootfs/sys rootfs/dev rootfs/run
          sudo mkdir -p rootfs/proc rootfs/sys rootfs/dev rootfs/run
          # Stream the rootfs into the container (docker cp makes a full tar copy in
          # /var/lib/docker/tmp which exhausts the runner disk):
          sudo tar -C rootfs -cf - --exclude=./proc --exclude=./sys --exclude=./dev --exclude=./run . | docker exec -i dakota-merge tar -xf - -C /
          docker commit --change 'LABEL org.opencontainers.image.title="Dakota Hyprland"' --change 'LABEL org.opencontainers.image.description="BuildStream immutable OS running Hyprland"' --change 'CMD ["/sbin/init"]' dakota-merge "$IMAGE_NAME"
          docker rm -f dakota-merge
          docker push "$IMAGE_NAME"

          # bootc's composefs backend can't read Docker schema2 config blobs on
          # switch (bootc-dev/bootc#1703, "blob unknown to registry"). Re-push the
          # same image as native OCI so bootc switch/upgrade works registry-direct:
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          skopeo copy --format oci \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker-daemon:$IMAGE_NAME" "docker://$IMAGE_NAME"
          skopeo inspect --raw "docker://$IMAGE_NAME" \
            --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | head -3

