name: Tailnet Smoke Test

# Proves the TS_AUTHKEY secret can bring a runner onto the tailnet and reach pi5.
# Manual dispatch is the real trigger; the push trigger below is scoped to one
# branch because GitHub only fires workflow_dispatch for workflows on the default
# branch. Scoped this way it is inert on main.

on:
  workflow_dispatch:
  push:
    branches: [fix/ci-compose-order-and-verify]

permissions:
  contents: read

jobs:
  tailnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Join the tailnet using the repo secret
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Report who joined and whether pi5 is reachable
        run: |
          set -uo pipefail
          TS="$(command -v tailscale || true)"
          if [ -z "$TS" ]; then
            TS="$(find /usr /opt /home -maxdepth 6 -name tailscale -type f -perm -u+x 2>/dev/null | head -1)"
          fi
          if [ -z "$TS" ]; then
            echo "FATAL: the action succeeded but no tailscale binary was found"
            echo "PATH=$PATH"
            exit 1
          fi
          echo "using: $TS"
          "$TS" version || true
          echo "=== self ==="
          "$TS" ip -4 || true
          "$TS" status || true
          echo "=== TCP reach to pi5 100.99.220.10:2283 (published docker port) ==="
          if timeout 8 bash -c 'cat < /dev/null > /dev/tcp/100.99.220.10/2283'; then
            echo "OK: pi5:2283 accepted a TCP connection over the tailnet"
          else
            echo "FATAL: no TCP connection to pi5 100.99.220.10:2283 over the tailnet"
            echo "  no tailnet ip above               -> stored key wrong/expired/revoked"
            echo "  joined but pi5 absent from peers  -> device approval pending, or no autoApprovers"
            echo "  pi5 listed but TCP refused        -> host not forwarding tailnet to docker ports"
            exit 1
          fi
