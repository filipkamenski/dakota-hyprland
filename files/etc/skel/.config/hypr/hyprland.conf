# Dakota Hyprland Configuration (Quickshell Omarchy 4.0 Desktop)
monitor=,preferred,auto,1

# Launch Quickshell Desktop Daemon (Navbar + Omni-menu)
exec-once = qs -n -d -c desktop
exec-once = qs -n -d -c song-drop
exec-once = qs -n -d -c expose
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1
exec-once = xdg-desktop-portal-hyprland

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

$mainMod = SUPER

# Applications & Launchers
bind = $mainMod, RETURN, exec, foot
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, flatpak run org.gnome.Nautilus
bind = $mainMod, V, togglefloating,

# Quickshell 4.0 Integrations
bind = $mainMod, SPACE, exec, qs -c desktop ipc call palette toggle
bind = $mainMod, TAB, exec, qs -c expose ipc call expose toggle
bind = $mainMod, F12, exec, qs -c screensaver ipc call saver toggle
bind = $mainMod SHIFT, G, exec, qs -c gamehud ipc call hud toggle
bind = $mainMod, L, exec, hyprlock

# Workspace navigation
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
