# Initramfs content for the bootc-rooted Dakota image (R-IMG-4).
#
# Location is not arbitrary: dracut-ng (which is what
# freedesktop-sdk.bst:components/dracut.bst builds, 112) resolves its config
# directory to ${sysroot}/etc/dracut.conf.d unless `-l/--local` is passed
# (dracut.sh: `confdir="${dracutsysrootdir-}/etc/dracut.conf.d"`). Note that
# ostree's own configure `--with-dracut` already drops
# /etc/dracut.conf.d/ostree.conf with `add_dracutmodules+=" ostree systemd "`
# and `reproducible=yes`, so the ostree module needs no duplication here.
#
# hostonly=no is mandatory for a distributable image: there is no host to be
# host-only about at build time, and bootc's own base image ships exactly
# this (`baseimage/dracut/usr/lib/dracut.conf.d/10-bootc-base.conf`, v1.17.1).
hostonly=no

# The `bootc` module (51bootc) is installed by bootc.bst's `make install`;
# like the ostree module it returns 255 from check() and is therefore never
# picked up implicitly. It installs bootc-root-setup.service +
# /usr/lib/bootc/initramfs-setup into the initramfs.
add_dracutmodules+=" bootc "

# LUKS + Btrfs root on the laptop. dm_mod is built in (x86_64_defconfig
# CONFIG_BLK_DEV_DM=y) but listed anyway so a config change cannot silently
# drop it; dm_crypt and btrfs are modules in the freedesktop-sdk kernel
# (files/linux/fdsdk-config.sh: `module DM_CRYPT`, `module BTRFS_FS`).
add_drivers+=" dm_mod dm_crypt btrfs "
