[terminal]
vt = 1

[default_session]
# Noctalia Greeter (greetd): user/session picker with Noctalia look & feel.
# Falls back to tuigreet if noctalia-greeter is absent at build time.
command = "noctalia-greeter-session || tuigreet --time --remember --session /usr/share/wayland-sessions/dakota-hyprland.desktop"
user = "greeter"
