# ostree-prepare-root configuration, consumed in the initramfs.
#
# Read by ostree-prepare-root from /usr/lib/ostree/prepare-root.conf (or
# /etc/ostree/prepare-root.conf); ostree's dracut module 50ostree copies it in
# from the real root when it is present. Documented values for
# `composefs.enabled` are yes | no | maybe | signed | verity (man
# ostree-prepare-root, "composefs.enabled"), so `yes` — not `true` — is the
# spelling that parses.
#
# Why this file exists at all: bootc's own root setup (51bootc's
# bootc-root-setup.service) is gated on the `composefs=`/`composefs.digest`
# kernel command line that bootc writes for a composefs deployment, and the
# ostree path (ostree-prepare-root) is gated on this file. Shipping it covers
# both, which is what the laptop's ESP evidence shows we need
# (<esp>/EFI/Linux/bootc_composefs-*/initrd).
#
# FAILURE MODE, on purpose loud not silent: with `yes`, ostree-prepare-root
# always uses composefs and the boot fails if composefs is unavailable or the
# deployment carries no composefs digest. If a first boot ever dies here, the
# one-line revert is `enabled = no` in this file (rebuild + redeploy).
[composefs]
enabled = yes
